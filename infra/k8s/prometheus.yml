global:
  scrape_interval: 15s
scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: [gateway-service:8080]}]
  - job_name: feature-service
    metrics_path: /actuator/prometheus
    static_configs: [{targets: [feature-service:8081]}]
  - job_name: decision-engine
    metrics_path: /actuator/prometheus
    static_configs: [{targets: [decision-engine:8082]}]
  - job_name: ml-service
    metrics_path: /metrics
    static_configs: [{targets: [ml-service:8000]}]
