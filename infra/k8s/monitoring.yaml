apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: traffic-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args: [--config.file=/etc/prometheus/prometheus.yml]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
          readinessProbe: {httpGet: {path: /-/ready, port: 9090}}
          livenessProbe: {httpGet: {path: /-/healthy, port: 9090}}
      volumes: [{name: config, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: traffic-platform}
spec: {selector: {app: prometheus}, ports: [{port: 9090, targetPort: 9090}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: traffic-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          ports: [{containerPort: 3000}]
          env: [{name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: traffic-platform-secrets, key: GRAFANA_ADMIN_PASSWORD}}}]
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
          readinessProbe: {httpGet: {path: /api/health, port: 3000}}
          livenessProbe: {httpGet: {path: /api/health, port: 3000}}
      volumes:
        - {name: datasources, configMap: {name: grafana-provisioning-datasources}}
        - {name: dashboard-provider, configMap: {name: grafana-provisioning-dashboards}}
        - {name: dashboards, configMap: {name: grafana-dashboards}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: traffic-platform}
spec: {selector: {app: grafana}, ports: [{port: 3000, targetPort: 3000}]}
