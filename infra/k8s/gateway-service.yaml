apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: traffic-platform
  labels:
    app: gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: ghcr.io/yaswanth2120/intelligent-traffic-management-system/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: traffic-platform-config
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          resources:
            # Right-sized from observed usage (~200-300Mi RSS under load) for
            # this local single-node kind cluster, which has only ~3.8GiB
            # allocatable -- see docs/autoscaling.md "resource constraints"
            # for the crash-loop this fixed (default 1s probe timeouts plus
            # 384Mi*3 replica requests pushed node memory requests to 97%,
            # causing scheduling failures and liveness-probe-triggered
            # restarts under load).
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: traffic-platform
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
