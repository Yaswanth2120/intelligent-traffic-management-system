apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: traffic-platform}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: traffic-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: traffic_platform}
            - {name: POSTGRES_USER, value: traffic_user}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: traffic-platform-secrets, key: POSTGRES_PASSWORD}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          readinessProbe: {tcpSocket: {port: 5432}}
          livenessProbe: {tcpSocket: {port: 5432}}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: postgres-data}}
        - {name: init, configMap: {name: postgres-init}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: traffic-platform}
spec: {selector: {app: postgres}, ports: [{port: 5432, targetPort: 5432}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: traffic-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.2
          ports: [{containerPort: 6379}]
          readinessProbe: {tcpSocket: {port: 6379}}
          livenessProbe: {tcpSocket: {port: 6379}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: traffic-platform}
spec: {selector: {app: redis}, ports: [{port: 6379, targetPort: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka, namespace: traffic-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.1
          ports: [{containerPort: 9092}]
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: PLAINTEXT://kafka:9092}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: 1@localhost:9093}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
            - {name: CLUSTER_ID, value: 4L6g3nShT-eMCtK--X86sw}
          readinessProbe: {tcpSocket: {port: 9092}, initialDelaySeconds: 15}
          livenessProbe: {tcpSocket: {port: 9092}, initialDelaySeconds: 30}
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: traffic-platform}
spec:
  selector: {app: kafka}
  ports:
    - {name: plaintext, port: 9092, targetPort: 9092}
    - {name: controller, port: 9093, targetPort: 9093}
