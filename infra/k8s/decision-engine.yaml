apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-engine
  namespace: traffic-platform
  labels:
    app: decision-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: decision-engine
  template:
    metadata:
      labels:
        app: decision-engine
    spec:
      containers:
        - name: decision-engine
          image: ghcr.io/yaswanth2120/intelligent-traffic-management-system/decision-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: traffic-platform-config
            - secretRef:
                name: traffic-platform-secrets
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8082}
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8082}
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          resources:
            # See infra/k8s/gateway-service.yaml -- same fix, same reason
            # (docs/autoscaling.md "resource constraints").
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: decision-engine
  namespace: traffic-platform
spec:
  selector:
    app: decision-engine
  ports:
    - port: 8082
      targetPort: 8082
