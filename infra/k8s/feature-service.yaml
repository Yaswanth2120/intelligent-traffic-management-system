apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-service
  namespace: traffic-platform
  labels:
    app: feature-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feature-service
  template:
    metadata:
      labels:
        app: feature-service
    spec:
      containers:
        - name: feature-service
          image: ghcr.io/yaswanth2120/intelligent-traffic-management-system/feature-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: traffic-platform-config
            - secretRef:
                name: traffic-platform-secrets
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8081}
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          resources:
            # See infra/k8s/gateway-service.yaml -- same right-sizing for the
            # same reason (observed usage ~50-320Mi on this constrained
            # local cluster).
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: feature-service
  namespace: traffic-platform
spec:
  selector:
    app: feature-service
  ports:
    - port: 8081
      targetPort: 8081
