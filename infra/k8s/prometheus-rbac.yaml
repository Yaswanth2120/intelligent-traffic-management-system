apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: traffic-platform}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus, namespace: traffic-platform}
rules:
  - apiGroups: [""]
    resources: [pods, endpoints, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus, namespace: traffic-platform}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: traffic-platform
